services:
  chainlit:
    build:
      context: .
      dockerfile: deploy/chainlit.Dockerfile
      args:
        APP_DIR: chatbot_complete
    env_file: .env
    environment:
      PORT: 10000
      CHATBOT_SESSION_DB_PATH: /data/conversation_history
    ports:
      - "10000:10000"
    volumes:
      - chroma_data:/app/chroma
      - chatbot_sessions:/data
    restart: unless-stopped

  multi-agent:
    build:
      context: .
      dockerfile: deploy/chainlit.Dockerfile
      args:
        APP_DIR: multi_agent_chatbot
    env_file: .env
    environment:
      CHAINLIT_APP: agentic_chatbot.py
      PORT: 10001
      CHATBOT_SESSION_DB_PATH: /data/conversation_history
    ports:
      - "10001:10001"
    volumes:
      - chroma_data:/app/chroma
      - multi_agent_sessions:/data
    restart: unless-stopped

  chatkit:
    build:
      context: ./chatkit
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CHATKIT_WORKFLOW_ID: ${NEXT_PUBLIC_CHATKIT_WORKFLOW_ID}
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - chainlit
    restart: unless-stopped

volumes:
  chroma_data:
  chatbot_sessions:
  multi_agent_sessions:
